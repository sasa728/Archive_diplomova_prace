version: '3.7'

services:
  soc-proxy:
    image: nginx:alpine
    container_name: soc-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - soc-network
      - single-node_default
      - greenbone-community-edition_default

networks:
  soc-network:
    external: true
  single-node_default:
    external: true
  greenbone-community-edition_default:
    external: true